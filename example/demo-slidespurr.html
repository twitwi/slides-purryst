<!DOCTYPE html>
<html lang="en" class="theme-clean">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>SlidesPurr Demo</title>
</head>
<body>

<template id="sp-content">

  <sp-slide>
    <h1>SlidesPurr(yst)</h1>
    <p>Where Typst meets Vue in purr-fect harmony.</p>
    <p style="color:#64748b;font-size:0.9em">Arrow keys or Space to navigate</p>
    <p>NB: this demo file is not using typst</p>
  </sp-slide>  

  <sp-slide no-toc>
    <h2>Here is TOC</h2>
    <sp-toc end="2"/>
  </sp-slide>  

  <sp-slide>
    <h2>Slide Transitions</h2>
    <p>Do not overuse...</p>
  </sp-slide>  

  <sp-slide>
    <h3>Transitions: options</h3>
    <p>Per-slide transitions via <code>transition</code> attribute.</p>
    <ul>
      <li><code>none</code> — default</li>
      <li><code>fade</code> — opacity fading</li>
      <li><code>slide-up</code> — vertical slide</li>
      <li><code>zoom</code> — scale in/out</li>
    </ul>
    <p>A "transition" option to createSlidesPurryst, that is used as default.</p>
  </sp-slide>

  <sp-slide transition="fade">
    <h3>This one is "fade"</h3>
    <img src="./slides-purryst-banner.svg" />
  </sp-slide>

  <sp-slide transition="slide-up">
    <h3>This one is "slide-up"</h3>
    <img src="./slides-purryst-banner.svg" style="transform: scale(-1,1)" />
  </sp-slide>

  <sp-slide transition="zoom" transition-duration="600" >
    <h3>This one is "zoom" (with 600ms)</h3>
    <img src="./slides-purryst-banner.svg" />
  </sp-slide>

  <sp-slide transition="fade" transition-duration="100" >
    <h3>This one is "fade" (with 100ms)</h3>
    <img src="./slides-purryst-banner.svg" style="transform: scale(-1,1)"/>
  </sp-slide>

  <sp-slide>
    <h3>Keyboard Navigation</h3>
    <ul>
      <li><kbd>→</kbd> / <kbd>Spc</kbd>: advance the presentation</li>
      <li><kbd>←</kbd>: backward</li>
      <li><kbd>↓</kbd> (next) / <kbd>↑</kbd> (previous) slide (skip steps) </li>
      <li><kbd>A</kbd> / <kbd>Z</kbd> to browse: previous/next slide's end</li>
      <li><kbd>G</kbd>: Open goto popup (number, header content)</li>
      <li><kbd>O</kbd>: Toggle overview</li>
      <li><kbd>F</kbd>: Toggle fullscreen</li>
    </ul>
    <sp-style>
      kbd { border: 5px solid var(--sp-accent-2) ; border-radius: .2em ; background: var(--sp-surface-alt); padding: 0 .2em; margin: 0 0.2em;  }
    </sp-style>
  </sp-slide>



  <sp-slide>
    <h2>Some interesting features</h2>
  </sp-slide>

  <sp-slide>
    <h3>A Table of Content</h3>
    <p>One can have "local" TOC</p>
    <sp-toc start="3" context />
    <sp-drag at="1202|62|524.5879060720367|961.4244706670144|0">
      <div style="font-size: 25px; border: 5px solid gray; background: var(--sp-surface); padding: 10px; position: absolute; inset: 0; overflow: scroll;">
        Full TOC
        <sp-toc />
      </div>
    </sp-drag>
  </sp-slide>

  <sp-slide>
    <h3>Custom Vue Components</h3>
    <p>Custom components work inside slides.</p>
    <my-counter :count="5"></my-counter>
    <sp-drag at="1334|375|549.7021037795132|559.4658884977841|0" style="font-size: 35px; border: 5px solid gray; background: var(--sp-surface); padding: 10px; overflow: scroll;">
      <sp-toc start="3"/>
    </sp-drag>
  </sp-slide>

  <sp-slide class="eg-draggables">
    <h3>Draggable Elements</h3>
    <p><code>&amp;lt;sp-drag>stuff&amp;lt;/sp-drag></code> creates a <span style="opacity: 0.2;">draggable box</span></p>
    <p>In dev mode:</p>
    <ul>
      <li>select with double click</li>
      <li>move and resize</li>
      <li>validate by deselecting</li>
      <li>⇒ the changes are saved to the source</li>
      <li>…… as a <code>at="..."</code> attribute</li>
    </ul>
    <sp-drag at="1199|106|641.887633341839|283.0415048145767|0.9" at="0|0|155|98|0">
      <div class="eg-natural eg-textcenter" style="--eg-hue: 270; ">Draggable box <br/>(natural size)</div>
    </sp-drag>
    <sp-pause />
    <sp-drag>stuff</sp-drag>
    <sp-drag at="953|515|891.9896580375619|184.07442507755945|23.8">
      <div class="eg-fill eg-center eg-textcenter" style="--eg-hue: 120;">One more box <br/>(fill and center+vcenter)</div>
    </sp-drag>
  </sp-slide>
  <sp-style>
    .eg-natural { display: inline-block; }
    .eg-fill { position: absolute; inset: 0; }
    .eg-center { display: flex; align-items: center; justify-content: center; }
    .eg-textcenter { text-align: center; }
    .eg-draggables .sp-drag-content > * {
      font-size: 0.75em;
      color: black;
      background: lch(90 40 var(--eg-hue));
      padding: 1em;
      border-radius: 8px;
      border: 2px solid lch(40 40 var(--eg-hue));
    }
  </sp-style>

  <sp-slide class="eg-draggables">
    <h3>Drag 2</h3>
    <sp-drag at="1199|106|641.887633341839|283.0415048145767|0.9" at="0|0|155|98|0">
      <div class="eg-natural eg-textcenter" style="--eg-hue: 270; ">Draggable box <br/>(natural size)</div>
    </sp-drag>
    <sp-drag at="953|515|891.9896580375619|184.07442507755945|23.8">
      <div class="eg-fill eg-center eg-textcenter" style="--eg-hue: 120;">One more box <br/>(fill and center+vcenter)</div>
    </sp-drag>
  </sp-slide>

  <sp-slide>
    <h3>Inline SVG (styleable, animatable)</h3>
    <p>Move your mouse on the cat</p>
    <sp-svg src="./slides-purryst-banner-sticker.svg" height="400px"></sp-svg>
    <sp-style>
      h2 { filter: blur(2px); }
    </sp-style>
    <p>(use <code>sp-style</code> in a slide or global)</p>
    <sp-svg src="./slides-purryst-banner-sticker.svg" width="100%" height="200"></sp-svg>

    <sp-drag at="1279|278|707.2299359907619|287.7049303965147|33.2">
      Draggable cat
      <sp-svg src="./slides-purryst-banner-sticker.svg" wrap class="smallcat"></sp-svg>
    </sp-drag>
  </sp-slide>
  
  <sp-slide>
    <h3>Presenter View and Slide Notes</h3>
    <p>Use <code>sp-notes</code> to add notes to a slide</p>
    <p>Use key <code>p</code> (or the <a @click="$sp.toggleNavLock()" title="click to toggle the toolbar">toolbar</a> at the bottom) to toggle presenter view</p>
    <sp-notes>
      <h4>Notes for this slide</h4>
      <p>These notes are only visible in presenter view.</p>
      <p>You can add any HTML content here, including images, lists, etc.</p>
    </sp-notes>
  </sp-slide>

  <sp-slide>
    <h3>Code Highlighting with Shiki</h3>
    <p>Use <code>sp-code</code> to add code snippets with syntax highlighting (NB: might become a plugin)</p>
    <pre><code class="language-typescript">
import { createSlidesPurryst } from '../src/index.ts'
import Counter from './Counter.vue'
createSlidesPurryst({
  components: { 'my-counter': Counter },
})
    </code></pre>
  </sp-slide>



  <sp-slide>
    <h2>Simple Slide Steps</h2>
  </sp-slide>

  <sp-slide>
    <h3>Explicit sp-step</h3>
    <p><code>sp-step</code> declares when its content appears</p>
    <p>Always visible.</p>
    <sp-step at="1"><div style="margin-top:0.5em;padding:0.5em 1em;background:#dbeafe;color:#1e40af;border-radius:6px">Step 1</div></sp-step>
    <sp-step at="2"><div style="padding:0.5em 1em;background:#dcfce7;color:#166534;border-radius:6px">Step 2...</div></sp-step>
    <p>Always visible.</p>
  </sp-slide>

  <sp-slide>
    <h3>Swap content − <code>sp-alternatives</code></h3>
    <p>it shows children one by one (or cycles if <code>cycle</code>)</p>
    <sp-alternatives cycle>
      <p style="background:#dbeafe;color:#1e40af;padding:0.5em;border-radius:6px">Alternative 1</p>
      <p style="background:#dcfce7;color:#166534;padding:0.5em;border-radius:6px">Alternative 2</p>
      <p style="background:#fef9c3;color:#653416;padding:0.5em;border-radius:6px">Alternative 3</p>
    </sp-alternatives>
    <p>It can start delayed (with e.g. <code>at="2"</code>)</p>
    <sp-alternatives at="2">
      <span style="background:#dbeafe;color:#1e40af;padding:0.5em;border-radius:6px">3</span>
      <span style="background:#dcfce7;color:#166534;padding:0.5em;border-radius:6px">4</span>
      <span style="background:#fef9c3;color:#653416;padding:0.5em;border-radius:6px">5</span>
    </sp-alternatives>
  </sp-slide>



  <sp-slide>
    <h2>Generic Slide Animations (steps)</h2>
  </sp-slide>

  <sp-slide>
    <h3><code>sp-pause</code>/<code>sp-jump</code> — visibility groups (vis groups)</h3>
    <p>Always visible</p>
    <sp-jump at="+1" />
    <p>Appears on click 1</p>
    <sp-pause />
    <p>Appears on click 2</p>
    <sp-jump at="+1" />
    <p>Appears on click 3.</p>
  </sp-slide>

  <sp-slide>
    <h3><code>sp-anim</code> — "selectors" (actions)</h3>
    <p>Always visible</p>
    <ul>
      <li>First</li>
      <li>Second</li>
      <li>Third.</li>
    </ul>
    <p>(rule of thumb: place anim after the elements)</p>
    <sp-anim spec="li:nth-of-type(1) | li:nth-of-type(2) | li:nth-of-type(3)" />
  </sp-slide>

  <sp-slide>
    <h3><code>sp-anim</code> — @children</h3>
    <ul>
      <li>First item</li>
      <li>Second item</li>
      <li>Third item</li>
      <li>Fourth item.</li>
    </ul>
    <p>(rule of thumb: place anim after the elements)</p>
    <sp-anim spec="@children(ul)" />
  </sp-slide>

  <!--
  -->
  <sp-slide>
    <h3><code>sp-anim</code> — Combined (visgroups + @children)</h3>
    <p>Always visible <span class="more">… after pause 2 (via anim)</span></p>
    <sp-pause />
    <p>After pause 1</p>
    <sp-anim spec=".more" />
    <p>After pause 2 (via anim)</p>
    <ul>
      <li>First item</li>
      <li>Second item</li>
      <li>Third item</li>
      <li>Fourth item.</li>
    </ul>
    <sp-anim spec="@children(ul)" />
    <sp-meanwhile />
    <p>Always visible</p>
  </sp-slide>

  <sp-slide>
    <h3><code>sp-anim</code> — Combined (selectors then children)</h3>
    <p>Always visible heading</p>
    <div class="step1" style="padding:.3em .6em;background:#dbeafe;color:#1e40af;border-radius:6px">Step 1 (S1)</div>
    <div class="step2" style="padding:.3em .6em;background:#dcfce7;color:#166534;border-radius:6px">Step 2 (S2)</div>
    <ul>
      <li>Child A (S3)</li>
      <li>Child B (S4)</li>
    </ul>
    <ol>
      <li>Child C (S5)</li>
      <li>Child D (S6)</li>
      <li>Child E (S7).</li>
    </ol>
    <sp-anim spec=".step1 | .step2 | @children(ul)" />
    <sp-anim spec="@children(ol)" />
    <sp-style>
      ul, ol { li {display: inline; border: 5px solid black; margin: 0.25em; } }
    </sp-style>
  </sp-slide>

  <sp-slide>
    <h3><code>sp-anim</code> — @add / @remove</h3>
    <img src="./lizard.png" />
    <p>Toggle CSS classes via <code>@add</code> and <code>@remove</code></p>
    <div style="display:flex;align-items:center;gap:2em">
      <sp-svg src="./slides-purryst-banner-sticker.svg" width="100%" style="flex-shrink:0"></sp-svg>
      <div style="font-size: 70%">
        <p><strong>Effects per step:</strong></p>
        <ol>
          <li><code>@add(glow, #catfill)</code> — cat fill glows</li>
          <li><code>2s @remove(glow, #catfill) ^ @add(pulse, #catTongue)</code> — fill glow off, tongue pulses</li>
          <li><code>@add(dim, #cat) ^ @crazy(#cat) ^ @laser()</code> — whole cat dims, cat goes crazy (plugin), laser effect (plugin)</li>
        </ol>
      </div>
    </div>
    <sp-anim spec="@add(glow, #catfill) | 2s @remove(glow, #catfill) ^ @add(pulse, #catTongue) | @add(dim, #cat) ^ @crazy(#cat) ^ @laser() | @laser()" />
    <sp-style>
      #catTongue { fill: red; }
      .glow { filter: drop-shadow(0 0 18px #ffd700) drop-shadow(0 0 40px #ffb300); transition: filter .3s; }
      .pulse { animation: pulse 0.5s ease-in-out 5; transform-origin: 50% 58%; }
      #cat { filter: none !important; }
      .dim { opacity: 0.3; transition: opacity 0.3s; }
    </sp-style>
  </sp-slide>
  <sp-style> <!-- for global styles, both style and sp-style work -->
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1, .1); } }
  </sp-style>
  <style>
    .eg-crazy { animation: crazy 0.5s ease-in-out 5; transform-origin: 50% 50%; }
    @keyframes crazy { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(10deg); } 50% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
  </style>

  <sp-slide>
    <h2>New Animation Features</h2>
  </sp-slide>

  <sp-style>
    .demo-items>*, .d1, .d2, .d3, .d4, .d5 {
      padding: 0.25em 1em;
      border-radius: 6px;
      margin: 0.25em 0;
      --hue: 220;
      background: lch(90 40 var(--hue));
      color: lch(20 20 var(--hue));
    }
    .demo-items {
      >:nth-child(1) { --hue: 220; }
      >:nth-child(2) { --hue: 120; }
      >:nth-child(3) { --hue: 60; }
      >:nth-child(4) { --hue: 330; }
      >:nth-child(5) { --hue: 0; }
    }
    .d1 { --hue: 220; }
    .d2 { --hue: 120; }
    .d3 { --hue: 60; }
    .d4 { --hue: 330; }
    .d5 { --hue: 0; }
    .debug-show-current-step { position: absolute; right: 30px; top: 30px; font-size: 30px; &::before { content: "Step: "; } }
  </sp-style>

  <sp-slide>
    <h3><code>sp-step</code> with <code>animation</code> presets</h3>
    <div class="debug-show-current-step">{{ $sp.stepIndex }}</div>
    <p>Elements can now animate in with presets:</p>
    <sp-step at="1" animation="fade"><div class="d1">Fade in</div></sp-step>
    <sp-step at="2" animation="up"><div class="d2">Slide up</div></sp-step>
    <sp-step at="3" animation="scale"><div class="d3">Scale in</div></sp-step>
  </sp-slide>

  <sp-slide>
    <h3><code>sp-step</code> with <code>after</code> modifier</h3>
    <div class="debug-show-current-step">{{ $sp.stepIndex }}</div>
    <p>Elements can share timing with the previous step:</p>
    <sp-step at="1"><div class="d1">Step 1 (first)</div></sp-step>
    <sp-step after><div class="d2">Step 1 (same timing)</div></sp-step>
    <sp-step at="2"><div class="d3">Step 2</div></sp-step>
  </sp-slide>

  <sp-slide>
    <h3><code>sp-step</code> with range visibility</h3>
    <div class="debug-show-current-step">{{ $sp.stepIndex }}</div>
    ... check it animates <sp-alternatives><span></span><span>step 1</span><span>step 2</span><span>done</span></sp-alternatives>
    <sp-meanwhile />
    <p>Elements can be visible only in a range of steps:</p>
    <sp-step from="1" to="3"><div class="d1">Visible at steps 1-2</div></sp-step>
    <sp-step from="3"><div class="d2">Visible from step 3 onward</div></sp-step>
  </sp-slide>

  <sp-slide>
    <h3><code>sp-clicks</code> wrapper</h3>
    <div class="debug-show-current-step">{{ $sp.stepIndex }}</div>
    <p>Sequential list animation (first item on first click):</p>
    <sp-clicks class="demo-items">
      <div>Item 1</div>
      <div>Item 2</div>
      <div>Item 3</div>
    </sp-clicks>
  </sp-slide>

  <sp-slide>
    <h3><code>sp-clicks</code> with options</h3>
    <div class="debug-show-current-step">{{ $sp.stepIndex }}</div>
    <p>With <code>every="2"</code> and <code>at="1"</code>:</p>
    <sp-clicks every="2" at="1" class="demo-items">
      <div>Items 1 (step 1)</div>
      <div>Items 2 (step 1)</div>
      <div>Items 3 (step 2)</div>
      <div>Items 4 (step 2)</div>
      <div>Items 5/5 (step 3)</div>
    </sp-clicks>
  </sp-slide>





  <sp-slide>
    <h2>Animate like Touying</h2>
  </sp-slide>

  <sp-slide>
    <h3><code>sp-pause</code> — structural step separator</h3>
    <div class="debug-show-current-step">{{ $sp.stepIndex }}</div>
    <p>Each <code>sp-pause</code> creates a step boundary:</p>
    <div class="d1">First — always visible</div>
    <sp-pause />
    <div class="d2">Second — after 1st pause</div>
    <sp-pause />
    <div class="d3">Third — after 2nd pause</div>
    <sp-pause />
    <div class="d4">Fourth — after 3rd pause</div>
    <p>(<code>sp-pause</code> is an alias for <code>sp-jump at="+1"</code>)</p>
  </sp-slide>

  <sp-slide>
    <h3><code>sp-meanwhile</code> — parallel tracks</h3>
    <div class="debug-show-current-step">{{ $sp.stepIndex }}</div>
    <p>Content before and after <code>sp-meanwhile</code> advances in parallel:</p>
    <sp-pause />
    <div class="d1" style="float: left">Left: step 1</div>
    <sp-pause />
    <div class="d2" style="float: left; clear: left;">Left: step 2</div>
    <sp-meanwhile />
    <sp-pause />
    <div class="d3" style="float: right">Right: step 1</div>
    <sp-pause />
    <div class="d4" style="float: right; clear: right;">Right: step 2</div>
    <sp-pause />
    <div class="d5" style="float: right; clear: right;">Right: step 3</div>
    <p>(<code>sp-meanwhile</code> is an alias for <code>sp-jump at="0"</code>)</p>
    <sp-meanwhile />
    <div style="border: 10px solid gray; border-radius: .5em; padding: 0.5em; margin-top: 150px; width: 50%;">
      <span class="d5">also inline</span>
      <sp-pause />
      <div>
        <span class="d1">S1</span>
        <sp-pause />
        <span class="d2">S2</span>
      </div>
    </div>

  </sp-slide>

  <sp-slide>
    <h3><code>sp-jump</code> — grouped visibility</h3>
    <div class="debug-show-current-step">{{ $sp.stepIndex }}</div>
    <p><code>sp-jump at="+N"</code> skips N steps — useful for grouping:</p>
    <sp-jump at="+1" /> <!-- sp-pause -->
    <div class="d1">Group A — (+1) visible after 1st pause</div>
    <sp-jump at="+1" /> <!-- sp-pause -->
    <div class="d2">Group B — (+1) visible after 2nd pause</div>
    <sp-jump at="+1" /> <!-- sp-pause -->
    <div class="d3">Group C — (+1) visible after 3rd pause</div>
    <sp-jump at="-2" />
    <div class="d1">Group A — (-2) also here (relative negative jump)</div>
    <sp-jump at="+1" /> <!-- sp-pause -->
    <div class="d2">Group B — (+1) also here (after previous)</div>
    <sp-jump at="1" />
    <div class="d1">Group A — (1) also here (absolute jump)</div>
    <sp-style>
      .d1,.d2,.d3 { font-size: 0.75em; }
    </sp-style>
  </sp-slide>

  <sp-slide>
    <h2>sp-anim: <code>at</code> and <code>no-jump</code></h2>
  </sp-slide>

  <sp-slide>
    <h3><code>sp-anim</code> with <code>at</code> offset</h3>
    <div class="debug-show-current-step">{{ $sp.stepIndex }}</div>
    <p><code>at="N"</code> offsets the starting step:</p>
    <p>(please step several times)
      <sp-alternatives><span>3</span><span>2</span><span>1</span><span>go</span><span>go</span><span>go</span></sp-alternatives>
    </p>
    <sp-meanwhile />
    <div class="d1 a">Action 1 (starts at step 3)</div>
    <div class="d2 b">Action 2 (starts at step 4)</div>
    <div class="d3 c">Action 3 (starts at step 5)</div>
    <sp-anim spec=".a | .b | .c" at="2" />
    <div>(after)</div>
    <sp-style>
      .a,.b,.c { font-size: 0.8em; }
    </sp-style>
  </sp-slide>

  <sp-slide>
    <h3><code>sp-anim</code> — default vis-group jump</h3>
    <div class="debug-show-current-step">{{ $sp.stepIndex }}</div>
    <p>By default, each anim part advances the vis group:
      <sp-alternatives><span>3</span><span>2</span><span>1</span><span>go</span><span>go</span><span>go</span></sp-alternatives>
    </p>
    <sp-meanwhile />
    <div class="d1 a">Part A (step 1)</div>
    <div class="d2 b">Part B (step 2)</div>
    <div class="d3 c">Part C (step 3)</div>
    <sp-anim spec=".a | .b | .c" at="2" />
    <div>(after)</div>
    <sp-meanwhile />
    <p style="color:var(--sp-text-3);font-size:0.8em">Each click advances both the anim AND the vis group</p>
  </sp-slide>

  <sp-slide>
    <h3><code>sp-anim</code> with <code>no-jump</code></h3>
    <div class="debug-show-current-step">{{ $sp.stepIndex }}</div>
    <p>Use <code>no-jump</code> to disable the vis-group advance:</p>
    <div class="d1 a">Part A (step 1)</div>
    <div class="d2 b">Part B (step 2)</div>
    <div class="d3 c">Part C (step 3)</div>

<script type="module">
import { createSlidesPurryst } from '../src/index.ts'
import Counter from './Counter.vue'
createSlidesPurryst({
  components: { 'my-counter': Counter },
  seed: 12345678+45,
  cacheIgnore: ['huge-.*\\.svg$'],  // don't inline huge SVGs in the output bundle
  // plugin-like extensions can be added via the activate hook
  activate: ({ addKeymapSetup, addAnimCommand, addAnimActionType }) => {
    // keymap updates
    addKeymapSetup((km) => {
      km['t'] = () => { document.documentElement.classList.toggle('theme-clean') }
    })
    // anim extension, simple shortcut
    addAnimCommand('crazy', {
      countSteps: () => 1,
      parse(argsStr) {
        const sel = argsStr.trim()
        return [{ type: 'addClass', className: 'eg-crazy', selector: sel }]
      },
    })
    // anim extension, custom type
    addAnimCommand('laser', {
      countSteps: () => 1,
      parse(argsStr) {
        return [{ type: 'random-laser' }]
      },
    })
    addAnimActionType('random-laser', {
      init(container, action) {
        if (!container.querySelector('.eg-laser')) {
          const laser = document.createElement('div')
          laser.className = 'eg-laser'
          laser.setAttribute('style', `
            position: absolute;
            width: 200px;
            height: 200px;
            inset: 0;
            transition: 1s transform;
            pointer-events: none;
            background: radial-gradient(circle at 100px 100px, rgba(255,0,0,0.5) 0%, transparent 20%) no-repeat;
          `)
          const x = Math.random() * (container.clientWidth - 200)
          const y = Math.random() * (container.clientHeight - 200)
          laser.style.transform = `translate(${x}px, ${y}px)`
          container.appendChild(laser)
        }
      },
      apply(container, action) {
        const laser = container.querySelector('.eg-laser')
        if (laser) {
          const x = Math.random() * (container.clientWidth - 200)
          const y = Math.random() * (container.clientHeight - 200)
          laser.style.transform = `translate(${x}px, ${y}px)`
        }
      },
      reverse(container, action) {
        const laser = container.querySelector('.eg-laser')
        if (laser) {
          const x = Math.random() * container.clientWidth
          const y = Math.random() * container.clientHeight
          laser.style.transform = `translate(${x}px, ${y}px)`
        }
      },
    })
  }
})
</script>
