<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>SlidesPurr Demo</title>
</head>
<body>

<template id="sp-content">

  <sp-slide>
    <h1>SlidesPurryst</h1>
    <p>Where Typst meets Vue in purr-fect harmony.</p>
    <p style="color:#64748b;font-size:0.9em">Arrow keys or Space to navigate</p>
    <p>NB: this demo file is not using typst</p>
  </sp-slide>  

  <sp-slide no-toc>
    <h2>Here is TOC</h2>
    <sp-toc />
  </sp-slide>  

  <sp-slide>
    <h2>Slide Transitions</h2>
    <p>Do not overuse...</p>
  </sp-slide>  

  <sp-slide>
    <h3>Transitions: options</h3>
    <p>Per-slide transitions via <code>transition</code> attribute.</p>
    <ul>
      <li><code>fade</code> — default</li>
      <li><code>slide-up</code> — vertical slide</li>
      <li><code>zoom</code> — scale in/out</li>
    </ul>
    <p>A "transition" option to createSlidesPurryst, that is used as default.</p>
  </sp-slide>

  <sp-slide transition="fade">
    <h3>This one is "fade"</h3>
    <img src="./slides-purryst-banner.svg" />
  </sp-slide>

  <sp-slide transition="slide-up">
    <h3>This one is "slide-up"</h3>
    <img src="./slides-purryst-banner.svg" style="transform: scale(-1,1)" />
  </sp-slide>

  <sp-slide transition="zoom">
    <h3>This one is "zoom"</h3>
    <img src="./slides-purryst-banner.svg" />
  </sp-slide>

  <sp-slide>
    <h3>Keyboard Navigation</h3>
    <ul>
      <li><kbd style="padding:0.1em 0.4em;border:1px solid #cbd5e1;border-radius:3px">→</kbd> / <kbd style="padding:0.1em 0.4em;border:1px solid #cbd5e1;border-radius:3px">Space</kbd> / <kbd style="padding:0.1em 0.4em;border:1px solid #cbd5e1;border-radius:3px">↓</kbd>: Next</li>
      <li><kbd style="padding:0.1em 0.4em;border:1px solid #cbd5e1;border-radius:3px">←</kbd> / <kbd style="padding:0.1em 0.4em;border:1px solid #cbd5e1;border-radius:3px">↑</kbd>: Previous</li>
      <li><kbd style="padding:0.1em 0.4em;border:1px solid #cbd5e1;border-radius:3px">Home</kbd> / <kbd style="padding:0.1em 0.4em;border:1px solid #cbd5e1;border-radius:3px">End</kbd>: First / Last</li>
      <li><kbd style="padding:0.1em 0.4em;border:1px solid #cbd5e1;border-radius:3px">a</kbd> / <kbd style="padding:0.1em 0.4em;border:1px solid #cbd5e1;border-radius:3px">z</kbd>: End of prev / next slide</li>
      <li><kbd style="padding:0.1em 0.4em;border:1px solid #cbd5e1;border-radius:3px">F</kbd>: Toggle fullscreen</li>
    </ul>
  </sp-slide>



  <sp-slide>
    <h2>Some authoring features</h2>
  </sp-slide>

  <sp-slide>
    <h3>Custom Vue Components</h3>
    <p>Custom components work inside slides.</p>
    <my-counter :count="5"></my-counter>
  </sp-slide>

  <sp-slide>
    <h3>Draggable Elements</h3>
    <sp-pause></sp-pause>
    <sp-drag at="287|249|700|246|15">
      <div style="color: black;background:#dbeafe;padding:1em;border-radius:8px;border:2px solid #3b82f6">Draggable box</div>
    </sp-drag>
    <sp-pause></sp-pause>
    <sp-drag at="1204|306|830.4111990326578|411.4949085496764|-39">
      <div style="color: black;background:#dcfce7;padding:1em;border-radius:8px;border:2px solid #22c55e">Another box</div>
    </sp-drag>
  </sp-slide>

  <sp-slide>
    <h3>Drag 2</h3>
    <sp-drag at="287|249|700|246|15">
      <div style="color: red;background:#dbeafe;padding:1em;border-radius:8px;border:2px solid #3b82f6">Draggable box</div>
    </sp-drag>
    <sp-drag at="1204|306|830.4111990326578|411.4949085496764|-39">
      <div style="color: red;background:#dcfce7;padding:1em;border-radius:8px;border:2px solid #22c55e">Another box</div>
    </sp-drag>
  </sp-slide>

  <sp-slide>
    <h3>Inline SVG</h3>
    <p>Move your mouse on the cat</p>
    <sp-svg src="./slides-purryst-banner-sticker.svg"></sp-svg>
    <br/>
    <sp-svg src="./slides-purryst-banner-sticker.svg" width="100%" height="200"></sp-svg>
    <sp-drag at="1187|187|759.4423673400632|267.9878776869065|35">
      <sp-svg src="./slides-purryst-banner-sticker.svg" wrap class="smallcat"></sp-svg>
    </sp-drag>
    <sp-style>
      h2 { filter: blur(2px); }
    </sp-style>
  </sp-slide>
    



  <sp-slide>
    <h2>Simple Slide Steps</h2>
  </sp-slide>

  <sp-slide>
    <h3>Explicit sp-step</h3>
    <p><code>sp-step</code> declares when its content appears</p>
    <p>Always visible.</p>
    <sp-step at="1"><div style="margin-top:0.5em;padding:0.5em 1em;background:#dbeafe;color:#1e40af;border-radius:6px">Step 1</div></sp-step>
    <sp-step at="2"><div style="padding:0.5em 1em;background:#dcfce7;color:#166534;border-radius:6px">Step 2...</div></sp-step>
  </sp-slide>

  <sp-slide>
    <h3>Swap content − <code>sp-alternatives</code></h3>
    <p>it shows children one by one (or cycles if <code>cycle</code>)</p>
    <sp-alternatives cycle>
      <p style="background:#dbeafe;color:#1e40af;padding:0.5em;border-radius:6px">Alternative 1</p>
      <p style="background:#dcfce7;color:#166534;padding:0.5em;border-radius:6px">Alternative 2</p>
      <p style="background:#fef9c3;color:#653416;padding:0.5em;border-radius:6px">Alternative 3</p>
    </sp-alternatives>
    <p>It can start delayed (with e.g. <code>at="2"</code>)</p>
    <sp-alternatives at="2">
      <span style="background:#dbeafe;color:#1e40af;padding:0.5em;border-radius:6px">3</span>
      <span style="background:#dcfce7;color:#166534;padding:0.5em;border-radius:6px">4</span>
      <span style="background:#fef9c3;color:#653416;padding:0.5em;border-radius:6px">5</span>
    </sp-alternatives>
  </sp-slide>

  <sp-slide>
    <h3><code>sp-anim</code> — @jump (vis groups)</h3>
    <p>Always visible</p>
    <sp-anim spec="@jump(1)" />
    <p>Appears on click 1</p>
    <sp-anim spec="@jump(1)" />
    <p>Appears on click 2</p>
    <sp-anim spec="@jump(1)" />
    <p>Appears on click 3</p>
  </sp-slide>

  <sp-slide>
    <h3><code>sp-anim</code> — selectors (actions)</h3>
    <p>Always visible</p>
    <sp-anim spec="li:nth-of-type(1) | li:nth-of-type(2) | li:nth-of-type(3)" />
    <ul>
      <li>First</li>
      <li>Second</li>
      <li>Third</li>
    </ul>
  </sp-slide>

  <sp-slide>
    <h3><code>sp-anim</code> — @children</h3>
    <sp-anim spec="@children(ul)" />
    <ul>
      <li>First item</li>
      <li>Second item</li>
      <li>Third item</li>
      <li>Fourth item</li>
    </ul>
  </sp-slide>

  <sp-slide>
    <h3><code>sp-anim</code> — Combined</h3>
    <p>Always visible heading</p>
    <sp-anim spec=".step1 | .step2 | @children(ul)" />
    <div class="step1" style="padding:.3em .6em;background:#dbeafe;color:#1e40af;border-radius:6px">Step 1</div>
    <div class="step2" style="padding:.3em .6em;background:#dcfce7;color:#166534;border-radius:6px">Step 2</div>
    <ul>
      <li>Child A</li>
      <li>Child B</li>
      <li>Child C</li>
    </ul>
  </sp-slide>

  <sp-slide>
    <h3><code>sp-anim</code> — @add / @remove</h3>
    <p>Toggle CSS classes via <code>@add</code> and <code>@remove</code></p>
    <div style="display:flex;align-items:center;gap:2em">
      <sp-svg src="./slides-purryst-banner-sticker.svg" width="100%" style="flex-shrink:0"></sp-svg>
      <div style="font-size: 70%">
        <p><strong>Effects per step:</strong></p>
        <ol>
          <li><code>@add(glow, #catfill)</code> — cat fill glows</li>
          <li><code>@remove(glow, #catfill) ^ @add(pulse, #catTongue)</code> — fill glow off, tongue pulses</li>
          <li><code>@add(dim, #cat)</code> — whole cat dims</li>
        </ol>
      </div>
    </div>
    <sp-anim spec="@add(glow, #catfill) | @remove(glow, #catfill) ^ @add(pulse, #catTongue) | @add(dim, #cat)" />
    <sp-style>
      #catTongue { fill: red; }
      .glow { filter: drop-shadow(0 0 18px #ffd700) drop-shadow(0 0 40px #ffb300); transition: filter .3s; }
      .pulse { animation: pulse 0.5s ease-in-out 5; transform-origin: 50% 58%; }
      .dim { opacity: 0.3; transition: opacity 0.3s; }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1, .1); } }
      #cat { filter: none !important; }
    </sp-style>
  </sp-slide>

  <sp-slide no-toc>
    <h2>Here comes the TOC again</h2>
    <sp-toc />
  </sp-slide>

  <sp-slide>
    <h3>Here comes the TOC again, full</h3>
    <sp-toc :end="2"/>
  </sp-slide>

  <sp-slide no-toc>
    <h1>END</h1>
  </sp-slide>

  <!-- global style -->
  <sp-style>
    svg #cat:not(:hover) { filter: blur(5px); }
    svg #cat:hover {
      #catfill {
        fill: yellow;
        .smallcat & {
          fill: chartreuse;
        }
      }
      #catTongue { fill: chartreuse; }
      #catT, #catV {
        filter: blur(10px);
      }
    }
  </sp-style>

</template>

<div id="sp-presentation" data-design-width="1920" data-design-height="1080" data-author="SlidesPurryst"></div>

<script type="module">
import { createSlidesPurryst } from '../src/index.ts'
import Counter from './Counter.vue'
createSlidesPurryst({ components: { 'my-counter': Counter } })
</script>
</body>
</html>
